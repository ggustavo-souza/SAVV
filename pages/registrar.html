<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVV Votorantim - Registre-se</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/registrar.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header class="headerNav">
        <nav class="navbar">
            <img src="../assets/images/SAVV_Logo_SemFundo.png" alt="Logo" class="logoNav">
            <ul>
                <button class="btnMenuHamburguer"><i class="bi bi-list corPrimaria"></i></button>
                <li><a href="../index.html">Home</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="denuncia.html">Denuncie</a></li>
                <button class="btn-login"><a href="login.html">Login</a></button>
            </ul>
        </nav>
    </header>
    <main>
        <section class="registrar">
            <div class="card-form">
                <h3>Registre-se</h3>

                <h1>Criar conta do Cidadão</h1>

                <h6>Junte-se à gestão ambiental de Votorantim </h6>

                <form>
                    <div class="form-label">
                        <label> NOME DO CIDADÃO: </label>
                        <input type="text" placeholder="Ex: João da Silva" required>
                    </div>

                <div class="form-label">
                <label> ENDEREÇO DE EMAIL: </label>
                <input type="email" placeholder="Ex: nome@exemplo.com" required>
                </div>

                <div class="row">
                    <div class="form-label">
                        <label> SENHA: </label>
                        <input type="password" placeholder="********" required>
                    </div>
                    <div class="form-label">
                        <label> CONFIRMAR SENHA: </label>
                        <input type="password" placeholder="********" required>
                    </div>
                </div>

                <div class="form-check">
                <input type="checkbox" id="termos" required>
                <label for="termos"> Aceito os <a href="#"> termos de utilização</a> e a política de privacidade dos dados.</label>
                </div>
                <button class="btnRegistrar">Registrar</button>

            </div>
        </form>
        </section>
    </main>
</body>

</html>
