<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Login - SAVV</title>
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>

    <section class="box-login">
        <div>
            <h2>ACESSO AO SISTEMA</h2>
            <br>
            <h1>Entrar na sua conta</h1>

            <label name="email">ENDEREÇO DE E-MAIL</label>
            <input  type="text" name="email" placeholder="nome@exemplo.com">

            <label name="password">SENHA</label>
            <a href="login.html" id="RememberSenha">ESQUECEU SUA SENHA?</a>
            <input  type="password" name="password" placeholder="***********">

            <button><a href="./pages/login.html">ENTRAR COM SUA CONTA</a></button>

            <hr>

            <p>Não tem uma conta? <a href="../pages/registrar.html" id="RegistrarLink">Regitre-se Agora.</a>

        </div>
    </section>
    
</body>
</html>
