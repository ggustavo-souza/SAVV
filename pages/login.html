<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SAVV</title>
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="../assets/images/SAVV_Logo_SemFundo.png" alt="Logo" class="logoNav">
            <ul>
                <button class="btnMenuHamburguer"><i class="bi bi-list corPrimaria"></i></button>
                <li><a href="../">Home</a></li>
                <li><a href="../pages/servicos.html">Serviços</a></li>
                <li><a href="../pages/denuncia.html">Denuncie</a></li>
                <button class="btn-login"><a href="../pages/login.html">Login</a></button>
            </ul>
        </nav>
    </header>

    <section class="boxlogin">
        <div class="forms">
            <h2>ACESSO AO SISTEMA</h2>
            <br>
            <h1>Entrar na sua conta</h1>

            <label name="email">ENDEREÇO DE E-MAIL</label>
            <input  type="text" name="email" placeholder="nome@exemplo.com">

            <div class="DisplayLabel" >
                <label name="password">SENHA</label>
                <a href="login.html" id="RememberSenha">ESQUECEU SUA SENHA?</a>
            </div>
            <input  type="password" name="password" placeholder="***********">

            <a href="./pages/login.html"><button>ENTRAR COM SUA CONTA</button></a>

            <hr>

            <p>Não tem uma conta? <a href="../pages/registrar.html" id="RegistrarLink">Regitre-se Agora.</a>

        </div>
    </section>
    
</body>
</html>
