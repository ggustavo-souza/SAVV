<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/denuncia.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>SAVV Votorantim - Denuncie</title>
</head>

<body>
    <header class="headerNav">
        <nav class="navbar">
            <img src="../assets/images/SAVV_Logo_SemFundo.png" alt="Logo" class="logoNav">
            <ul>
                <button class="btnMenuHamburguer"><i class="bi bi-list corPrimaria"></i></button>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pages/servicos.html">Serviços</a></li>
                <li><a href="../pages/denuncia.html">Denuncie</a></li>
                <button class="btn-login"><a href="../pages/login.html">Login</a></button>
            </ul>
        </nav>
    </header>
    <section>

        <div class="containerDenuncia">
            <span class="subtituloVerde">DENÚNCIA</span>
            <span class="tituloPrincipalDenuncia">Nova Ocorrência</span>
            <p class="textoSub">Relate problemas ambientais em Votorantim.</p>


        </div>

        <div class="containerFormularioDenuncia">
            <form class="formDenuncia">
                <div class="denunciaItem">
                    <label class="labelDenuncia" for="tipoServico">tipo do serviço</label>
                    <input class="inputDenuncia" type="text" id="tipoServico" name="tipoServico"
                        placeholder="Ex: Limpeza de rua" required>
                </div>
                <div class="denunciaItem">
                    <label class="labelDenuncia" for="descricao">relato da ocorrência</label>
                    <textarea class="inputDenuncia1" id="descricao" name="descricao" rows="5" required></textarea>
                </div>

                <div class="denunciaItem2">
                    <div class="denunciaItem">
                        <label class="labelDenuncia" for="cep">CEP</label>
                        <input class="inputDenuncia" type="tel" id="cep" name="cep" placeholder="Ex: 00000-000"
                            required>
                    </div>
                    <div class="denunciaItem">
                        <label class="labelDenuncia" for="bairro">bairro</label>
                        <input class="inputDenuncia" type="text" id="bairro" name="bairro"
                            placeholder="Ex: Centro, Votorantim - SP" required>
                    </div>
                </div>

                <div class="denunciaItem">
                    <label class="labelDenuncia" for="endereco">endereço</label>
                    <input class="inputDenuncia" type="text" id="endereco" name="endereco"
                        placeholder="Ex: Rua Exemplo, 123" required>
                </div>

                <div class="container-imagem">
                    <img src="../assets/images/foto_mapa_servicos.png" alt="">
                </div>

                <div class="denunciaItem">
                    <label for="botao-arquivo" class="labelDenuncia">evidência fotográfica</label>
                    <label class="botao-arquivo" id='botao-arquivo' for="foto"><i class="bi bi-cloud"></i>Arraste fotos
                        ou clique para fazer upload</label>
                    <input class="inputDenunciaAnexo" type="file" id="foto" name="foto" accept="image/*" required>
                </div>

                <button type="submit" class="btnEnviarDenuncia">Enviar Denúncia</button>


            </form>
        </div>
    </section>
    <footer>
        <div class="contatos">
            <a href="http://"><img src="../assets/images/icon-face.png" alt="Facebook"></a>
            <a href="http://"><img src="../assets/images/icon-insta.png" alt="Instagram"></a>

            <h1> (15) 00000-0000 </h1>
        </div>
        <div class="linksmenu">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="denuncia.html">Denuncie</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
        <div class="mapa">
            <img src="../assets/images/mapa_secretaria.png" alt="Endereço Secretaria do Meio Ambiente">
        </div>
    </footer>
    <script src="../assets/js/script.js"></script>
</body>

</html>
